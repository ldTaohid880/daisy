[project]
name = "daisy-tools"
version = "0.0.0"
description = "Python tooling for the Daisy repository (fixtures, design boards, analysis)."
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
