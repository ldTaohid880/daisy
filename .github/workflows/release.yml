name: Release

# A tag vX.Y.Z (created by release-please or by hand) builds installers on all three OSes
# and uploads them, with auto-update metadata, to a draft GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($version)"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build and upload installers
        shell: bash
        # electron-builder reads an empty CSC_LINK as a path (macOS: "apps/desktop not a file"), so variables
        # whose secret is not set are removed. Unsigned until M00-T07 sets the secrets.
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          pnpm --filter @daisy/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing: empty secrets produce unsigned builds (fine for alpha).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          # The C++ addon must build for every shipped architecture (ADR 0013).
          DAISY_NATIVE_ARCHS: ${{ runner.os == 'Windows' && 'x64,arm64' || 'x64' }}
